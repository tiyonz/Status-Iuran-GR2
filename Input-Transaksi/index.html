<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Transaksi Iuran Warga</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem 1rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: var(--card-bg); width: 100%; max-width: 500px; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
        h2 { margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.875rem; }
        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        button:hover { background-color: var(--primary-dark); }
        .back-link { display: block; text-align: center; margin-top: 1rem; font-size: 0.875rem; color: var(--text-muted); text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2><i class="fa-solid fa-pen-to-square"></i> Form Input Iuran Warga</h2>
        <form id="inputForm">
            <div class="form-group">
                <label for="nama">Nama Warga</label>
                <input type="text" id="nama" required placeholder="Contoh: Budi Santoso">
            </div>
            <div class="form-group">
                <label for="blok">Blok / Nomor Rumah</label>
                <input type="text" id="blok" required placeholder="Contoh: Blok A No. 12">
            </div>
            <div class="form-group">
                <label for="nominal">Nominal Pembayaran (Rp)</label>
                <input type="number" id="nominal" required placeholder="Contoh: 50000">
            </div>
            <button type="submit" id="submitBtn"><i class="fa-solid fa-floppy-disk"></i> Simpan Data</button>
        </form>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard</a>
    </div>

    <script>
        const WEB_APP_URL = "MASUKKAN_URL_WEB_APP_ANDA_DISINI";

        document.getElementById('inputForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'Menyimpan...';
            btn.disabled = true;

            // Sesuaikan susunan array data dengan kolom spreadsheet Anda
            const payload = [
                document.getElementById('nama').value,
                document.getElementById('blok').value,
                document.getElementById('nominal').value
                // Tambahkan data kolom lain jika diperlukan
            ];

            fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                alert(result.message);
                document.getElementById('inputForm').reset();
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan Data';
                btn.disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Terjadi kesalahan saat menyimpan data.');
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan Data';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
