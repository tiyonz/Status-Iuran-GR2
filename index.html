<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Iuran Warga - Gaharu Residence 2</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1350px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px 24px;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 20px;
            color: var(--primary);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 2px;
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .badge-periode {
            background: var(--accent-gradient);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .filter-section {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .btn-filter {
            background-color: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .btn-filter:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .btn-filter.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .table-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr:hover {
            background-color: rgba(59, 130, 246, 0.03);
        }

        .check { color: #10b981; font-weight: bold; font-size: 15px; }
        .cross { color: #ef4444; font-weight: bold; font-size: 15px; }
        .dash  { color: #94a3b8; font-weight: bold; font-size: 15px; }

        .loading-state, .error-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 14px;
        }

        .error-state { color: #ef4444; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="header-card">
            <div class="header-title">
                <h1>📊 Transparansi Iuran Warga</h1>
                <p>Forum Warga Gaharu Residence 2</p>
            </div>
            <div class="badge-periode">Periode Tahun 2026</div>
        </div>

        <div class="filter-section" id="filter-buttons">
            <button class="btn-filter active" onclick="filterBlok('SEMUA', this)">Semua Blok</button>
            <button class="btn-filter" onclick="filterBlok('A', this)">Blok A</button>
            <button class="btn-filter" onclick="filterBlok('B', this)">Blok B</button>
            <button class="btn-filter" onclick="filterBlok('C', this)">Blok C</button>
            <button class="btn-filter" onclick="filterBlok('D', this)">Blok D</button>
            <button class="btn-filter" onclick="filterBlok('E', this)">Blok E</button>
            <button class="btn-filter" onclick="filterBlok('FGH', this)">Blok FGH</button>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <div id="tabel-container" class="loading-state">Memuat data dari Google Sheets...</div>
            </div>
        </div>

    </div>

    <script>
        // MASUKKAN LINK CSV ANDA DI DALAM TANDA PETIK TUNGGAL DI BAWAH INI:
        const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR-uhgGLUDduChqVX82yMVn_pn8c88w-pD05DAt7GjZwo3iDelLk9u-7y-BOGVjNYv_5OaErP_lLTrS/pub?gid=381427425&single=true&output=csv';
        let barisData = [];

        fetch(urlCSV)
            .then(response => {
                if (!response.ok) throw new Error('Jaringan bermasalah: ' + response.status);
                return response.text();
            })
            .then(text => {
                if (text.includes('<!DOCTYPE html>')) {
                    throw new Error('Link salah. Pastikan file Google Sheets sudah di-Publish to Web (format CSV).');
                }
                barisData = text.split('\n').filter(r => r.trim() !== '');
                tampilkanTabel('SEMUA');
            })
            .catch(error => {
                let container = document.getElementById('tabel-container');
                container.className = 'error-state';
                container.innerHTML = `⚠️ <b>Gagal Memuat Data</b><br><br>${error.message}`;
            });

        function parseCSVLine(text) {
            let result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim().replace(/^"|"$/g, ''));
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim().replace(/^"|"$/g, ''));
            return result;
        }

        function tampilkanTabel(pilihanBlok) {
            let html = '<table>';
            let headerDibuat = false;
            let targetColsIndex = [];

            barisData.forEach((row, index) => {
                const cols = parseCSVLine(row);

                if (index === 0 && (cols[0].toUpperCase().includes('BLOK') || cols.length < 5)) {
                    return; 
                }

                if (!headerDibuat) {
                    html += '<thead><tr>';
                    cols.forEach((c, idx) => {
                        let headerName = c.toUpperCase();
                        if (!headerName.includes('TUNGGAKAN') && !headerName.includes('JUMLAH') && headerName !== 'STATUS') {
                            targetColsIndex.push(idx);
                            html += `<th>${c}</th>`;
                        }
                    });
                    html += '</tr></thead><tbody>';
                    headerDibuat = true;
                    return;
                }

                let kolomBlok = cols[0] ? cols[0].toUpperCase() : '';
                let cocok = (pilihanBlok === 'SEMUA') || (kolomBlok === pilihanBlok.toUpperCase());

                if (cocok) {
                    html += '<tr>';
                    targetColsIndex.forEach(idx => {
                        let val = cols[idx] !== undefined ? cols[idx] : '';
                        let cellContent = val;

                        if (val === '✔' || val.toLowerCase() === 'v') {
                            cellContent = `<span class="check">✔</span>`;
                        } else if (val === '✖' || val === 'X' || val.toLowerCase() === 'x') {
                            cellContent = `<span class="cross">✖</span>`;
                        } else if (val === '-' || val === '—') {
                            cellContent = `<span class="dash">—</span>`;
                        } else if (val.toUpperCase().includes('LUNAS')) {
                            cellContent = `<span style="color: #10b981; font-weight: 700;">${val}</span>`;
                        } else if (val.toUpperCase().includes('MENUNGGAK')) {
                            cellContent = `<span style="color: #ef4444; font-weight: 700;">${val}</span>`;
                        } else if (val.toUpperCase().includes('KOSONG')) {
                            cellContent = `<span style="color: #94a3b8; font-style: italic;">${val}</span>`;
                        }

                        html += `<td>${cellContent}</td>`;
                    });
                    html += '</tr>';
                }
            });

            html += '</tbody></table>';
            document.getElementById('tabel-container').innerHTML = html;
        }

        function filterBlok(blok, element) {
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            tampilkanTabel(blok);
        }
    </script>
</body>
</html>
