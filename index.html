<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Iuran Warga - Gaharu Residence 2</title>
    <style>
        :root {
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px 10px;
        }

        .dashboard-container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Header Card */
        .header-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .header-card h1 {
            font-size: 22px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header-card p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Filter Section */
        .filter-section {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn-filter {
            background-color: #f8fafc;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-filter:hover {
            background-color: #f1f5f9;
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-filter.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        /* Table Card Container */
        .table-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        /* Status Styling (Jika ada teks LUNAS / MENUNGGAK) */
        td:contains('LUNAS') { color: #16a34a; font-weight: bold; }

        .loading-state, .error-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-style: italic;
        }

        .error-state { color: #dc2626; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Header Informasi -->
        <div class="header-card">
            <h1>📊 Transparansi Iuran Warga</h1>
            <p>Forum Warga Gaharu Residence 2 — Pilih blok di bawah untuk melihat rincian.</p>
        </div>

        <!-- Tombol Filter per Blok -->
        <div class="filter-section" id="filter-buttons">
            <button class="btn-filter active" onclick="filterBlok('SEMUA', this)">Semua Blok</button>
            <button class="btn-filter" onclick="filterBlok('A', this)">Blok A</button>
            <button class="btn-filter" onclick="filterBlok('B', this)">Blok B</button>
            <button class="btn-filter" onclick="filterBlok('C', this)">Blok C</button>
            <button class="btn-filter" onclick="filterBlok('D', this)">Blok D</button>
            <button class="btn-filter" onclick="filterBlok('E', this)">Blok E</button>
            <button class="btn-filter" onclick="filterBlok('FGH', this)">Blok FGH</button>
        </div>

        <!-- Konten Tabel -->
        <div class="table-card">
            <div class="table-responsive">
                <div id="tabel-container" class="loading-state">Memuat data dari Google Sheets...</div>
            </div>
        </div>

    </div>

    <script>
        // --- GANTI LINK DI BAWAH INI DENGAN LINK CSV GOOGLE SHEETS ANDA ---
        const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR-uhgGLUDduChqVX82yMVn_pn8c88w-pD05DAt7GjZwo3iDelLk9u-7y-BOGVjNYv_5OaErP_lLTrS/pub?gid=381427425&single=true&output=csv';
        let barisData = [];

        fetch(urlCSV)
            .then(response => response.text())
            .then(text => {
                barisData = text.split('\n').filter(r => r.trim() !== '');
                tampilkanTabel('SEMUA');
            })
            .catch(error => {
                document.getElementById('tabel-container').className = 'error-state';
                document.getElementById('tabel-container').innerHTML = 'Gagal memuat data. Periksa kembali link CSV publik Anda.';
                console.error(error);
            });

        function tampilkanTabel(pilihanBlok) {
            let html = '<table>';
            let headerDibuat = false;

            barisData.forEach((row, index) => {
                const cols = row.split(',').map(c => c.replace(/^"|"$/g, '').trim());

                // Lewati baris judul utama sheet yang tidak penting
                if (index === 0 && (cols[0].includes('BLOK') || cols.length < 5)) {
                    return; 
                }

                // Ambil header tabel utama
                if (!headerDibuat) {
                    html += '<thead><tr>';
                    cols.forEach(c => html += `<th>${c}</th>`);
                    html += '</tr></thead><tbody>';
                    headerDibuat = true;
                    return;
                }

                let kolomBlok = cols[0] ? cols[0].toUpperCase() : '';
                let cocok = false;

                if (pilihanBlok === 'SEMUA') {
                    cocok = true;
                } else {
                    if (kolomBlok === pilihanBlok.toUpperCase()) {
                        cocok = true;
                    }
                }

                if (cocok) {
                    html += '<tr>';
                    cols.forEach(c => {
                        let styleClass = '';
                        if (c.includes('LUNAS')) styleClass = 'color: #16a34a; font-weight: bold;';
                        if (c.includes('MENUNGGAK')) styleClass = 'color: #dc2626; font-weight: bold;';
                        if (c.includes('KOSONG')) styleClass = 'color: #94a3b8; font-style: italic;';
                        
                        html += `<td style="${styleClass}">${c}</td>`;
                    });
                    html += '</tr>';
                }
            });

            html += '</tbody></table>';
            document.getElementById('tabel-container').innerHTML = html;
        }

        function filterBlok(blok, element) {
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            tampilkanTabel(blok);
        }
    </script>

</body>
</html>
