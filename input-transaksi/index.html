<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Transaksi — Gaharu Residence II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1F3D2E;
    --forest-deep:#13251C;
    --brass:#B8935A;
    --brass-light:#D9BE8E;
    --ivory:#F6F2E8;
    --paper:#FFFEFB;
    --line:#E2DBC8;
    --ink:#20291F;
    --ink-muted:#5C6A57;
    --success:#2F6B4F;
    --success-bg:#E6EFE7;
    --danger:#A6472B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--ivory);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .card-container{
    width:100%;max-width:560px;
    background:var(--paper);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 28px -18px rgba(19,37,28,0.35);overflow:hidden;
  }
  .card-header{background:var(--forest-deep);color:var(--ivory);padding:24px;border-bottom:2px solid var(--brass);}
  .card-header h1{font-family:'Fraunces',serif;font-weight:600;font-size:20px;}
  .card-header p{font-family:'Fraunces',serif;font-style:italic;font-size:12.5px;color:var(--brass-light);margin-top:4px;}
  .card-body{padding:24px;}
  .form-group{margin-bottom:16px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--forest-deep);margin-bottom:6px;}
  input[type="text"], input[type="number"], input[type="password"], select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
    font-size:13.5px;background:var(--ivory);color:var(--ink);
  }
  input:focus, select:focus{outline:none;border-color:var(--brass);background:var(--paper);}
  
  .bulan-grid{
    display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;background:var(--ivory);padding:12px;border:1px solid var(--line);border-radius:6px;
  }
  .bulan-item{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;}

  .btn-submit{
    width:100%;background:var(--forest);color:var(--ivory);border:none;padding:12px;
    border-radius:6px;font-weight:600;font-size:13.5px;cursor:pointer;margin-top:12px;
  }
  .btn-submit:hover{background:var(--forest-deep);}
  .back-link{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:var(--ink-muted);text-decoration:none;}
  .back-link:hover{color:var(--forest-deep);text-decoration:underline;}
  .alert-box{padding:12px;border-radius:6px;font-size:12.5px;margin-bottom:16px;display:none;}
  .alert-box.success{background:var(--success-bg);color:var(--success);border:1px solid rgba(47,107,79,0.3);}
  .alert-box.error{background:#F4E5DD;color:var(--danger);border:1px solid rgba(166,71,43,0.3);}
  
  #formContent { display:none; } /* Terkunci sampai URL Web App dimasukkan dan diverifikasi */
</style>
</head>
<body>

  <div class="card-container">
    <div class="card-header">
      <h1>Gaharu Residence II</h1>
      <p>Form Pengurus — Verifikasi Akses &amp; Catat Iuran</p>
    </div>
    <div class="card-body">
      <div id="alertBox" class="alert-box"></div>

      <!-- Kotak Verifikasi URL Web App sebagai Pengganti Password -->
      <div class="form-group" id="authBox">
        <label for="webAppUrlInput">Masukkan Kunci Akses (URL Web App Apps Script)</label>
        <div style="display:flex; gap:8px;">
          <input type="password" id="webAppUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
          <button type="button" id="unlockBtn" style="background:var(--brass); color:var(--forest-deep); border:none; padding:10px 16px; border-radius:6px; font-weight:600; cursor:pointer; white-space:nowrap;" onclick="verifikasiAkses()">Buka Akses</button>
        </div>
        <p style="font-size:11.5px; color:var(--ink-muted); margin-top:6px; font-style:italic;">Form input baru akan terbuka setelah URL Web App yang valid dimasukkan.</p>
      </div>

      <!-- Form Utama (Akan muncul setelah verifikasi URL berhasil) -->
      <form id="inputForm" style="display:none;">
        <div class="form-group">
          <label for="blok">Blok &amp; No. Rumah</label>
          <input type="text" id="blok" required placeholder="Contoh: Blok A No. 12">
        </div>
        <div class="form-group">
          <label for="nama">Nama Warga / Penghuni</label>
          <input type="text" id="nama" list="listWarga" required placeholder="Ketik atau pilih nama warga...">
          <datalist id="listWarga"></datalist>
        </div>

        <div class="form-group">
          <label>Pilih Bulan yang Dibayar (Bisa > 1 bulan)</label>
          <div class="bulan-grid">
            <label class="bulan-item"><input type="checkbox" name="bulan" value="Januari"> Januari</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="Februari"> Februari</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="Maret"> Maret</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="April"> April</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="Mei"> Mei</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="Juni"> Juni</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="Juli"> Juli</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="Agustus"> Agustus</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="September"> September</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="Oktober"> Oktober</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="November"> November</label>
            <label class="bulan-item"><input type="checkbox" name="bulan" value="Desember"> Desember</label>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Simpan &amp; Perbarui Checklist</button>
      </form>

      <a href="../index.html" class="back-link">← Kembali ke Dashboard Utama</a>
    </div>
  </div>

  <script>
    let ACTIVE_WEB_APP_URL = "";

    function verifikasiAkses() {
      const urlInput = document.getElementById('webAppUrlInput').value.trim();
      const alertBox = document.getElementById('alertBox');

      if (!urlInput.startsWith("https://script.google.com")) {
        alertBox.className = 'alert-box error';
        alertBox.textContent = 'URL Web App tidak valid! Pastikan formatnya benar.';
        alertBox.style.display = 'block';
        return;
      }

      // Tes koneksi ke URL tersebut untuk mengambil data list warga
      document.getElementById('unlockBtn').textContent = 'Memeriksa...';
      
      fetch(urlInput)
        .then(response => response.json())
        .then(data => {
          if (!data || data.length === 0) throw new Error('Data kosong');
          
          // Jika berhasil diakses, simpan URL dan buka form
          ACTIVE_WEB_APP_URL = urlInput;
          
          // Isi datalist nama warga
          const datalist = document.getElementById('listWarga');
          datalist.innerHTML = '';
          for (let i = 1; i < data.length; i++) {
            let namaWarga = data[i][2]; // Kolom C: Nama
            if (namaWarga) {
              let option = document.createElement('option');
              option.value = namaWarga;
              datalist.appendChild(option);
            }
          }

          // Sembunyikan kotak kunci, tampilkan form utama
          document.getElementById('authBox').style.display = 'none';
          document.getElementById('inputForm').style.display = 'block';
          alertBox.style.display = 'none';
        })
        .catch(error => {
          console.error(error);
          alertBox.className = 'alert-box error';
          alertBox.textContent = 'Gagal terhubung ke Web App. Periksa kembali URL atau pastikan akses Deployment sudah "Anyone".';
          alertBox.style.display = 'block';
          document.getElementById('unlockBtn').textContent = 'Buka Akses';
        });
    }

    document.getElementById('inputForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      
      const selectedBulan = [];
      document.querySelectorAll('input[name="bulan"]:checked').forEach(cb => {
        selectedBulan.push(cb.value);
      });

      if (selectedBulan.length === 0) {
        alert('Pilih minimal satu bulan pembayaran!');
        return;
      }
      
      btn.textContent = 'Menyimpan...';
      btn.disabled = true;
      alertBox.style.display = 'none';

      const payload = {
        blok: document.getElementById('blok').value,
        nama: document.getElementById('nama').value,
        bulan: selectedBulan
      };

      fetch(ACTIVE_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(result => {
        alertBox.className = 'alert-box ' + (result.status === 'success' ? 'success' : 'error');
        alertBox.textContent = result.message;
        alertBox.style.display = 'block';
        if(result.status === 'success') {
          document.getElementById('inputForm').reset();
        }
        btn.textContent = 'Simpan & Perbarui Checklist';
        btn.disabled = false;
      })
      .catch(error => {
        console.error('Error:', error);
        alertBox.className = 'alert-box error';
        alertBox.textContent = 'Terjadi kesalahan koneksi ke server.';
        alertBox.style.display = 'block';
        btn.textContent = 'Simpan & Perbarui Checklist';
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
