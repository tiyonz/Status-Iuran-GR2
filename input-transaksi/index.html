<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Transaksi Iuran Warga</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="date"], input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .checkbox-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #fafafa; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .checkbox-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        button { background-color: #28a745; color: white; padding: 12px; border: none; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .loading { text-align: center; color: #007bff; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Input Transaksi Iuran</h2>
    <form id="transaksiForm">
        
        <div class="form-group">
            <label for="tanggal">Tanggal Transaksi:</label>
            <input type="date" id="tanggal" required>
        </div>

        <div class="form-group">
            <label for="kodeRumah">Kode Rumah:</label>
            <input type="text" id="kodeRumah" placeholder="Contoh: A-12">
        </div>

        <div class="form-group">
            <label for="namaWarga">No Rumah + Penghuni (Nama Warga):</label>
            <select id="namaWarga" required>
                <option value="">-- Memuat Data Warga... --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="belumBayar">Belum Bayar (Bulan sebelumnya jika ada):</label>
            <input type="text" id="belumBayar" placeholder="Contoh: Nov, Des">
        </div>

        <div class="form-group">
            <label>Pilih Bulan yang Dibayar:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="bulan" value="Jan"> Jan</label>
                <label><input type="checkbox" name="bulan" value="Feb"> Feb</label>
                <label><input type="checkbox" name="bulan" value="Mar"> Mar</label>
                <label><input type="checkbox" name="bulan" value="Apr"> Apr</label>
                <label><input type="checkbox" name="bulan" value="Mei"> Mei</label>
                <label><input type="checkbox" name="bulan" value="Jun"> Jun</label>
                <label><input type="checkbox" name="bulan" value="Jul"> Jul</label>
                <label><input type="checkbox" name="bulan" value="Agu"> Agu</label>
                <label><input type="checkbox" name="bulan" value="Sep"> Sep</label>
                <label><input type="checkbox" name="bulan" value="Okt"> Okt</label>
                <label><input type="checkbox" name="bulan" value="Nov"> Nov</label>
                <label><input type="checkbox" name="bulan" value="Des"> Des</label>
            </div>
        </div>

        <div class="form-group">
            <label for="jumlahBulan">Jumlah Bulan:</label>
            <input type="number" id="jumlahBulan" readonly placeholder="Otomatis terhitung">
        </div>

        <div class="form-group">
            <label for="iuranBulan">Iuran per Bulan (Rp):</label>
            <input type="number" id="iuranBulan" placeholder="Contoh: 50000" oninput="hitungTotal()">
        </div>

        <div class="form-group">
            <label for="nominalSeharusnya">Nominal Seharusnya (Rp):</label>
            <input type="number" id="nominalSeharusnya" readonly placeholder="Otomatis terhitung">
        </div>

        <div class="form-group">
            <label for="nominalDiterima">Nominal Diterima (Rp):</label>
            <input type="number" id="nominalDiterima" required placeholder="Masukkan uang yang diterima">
        </div>

        <div class="form-group">
            <label for="petugas">Diterima Oleh (Petugas):</label>
            <select id="petugas" required>
                <option value="">-- Memuat Data Petugas... --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="keterangan">Keterangan:</label>
            <textarea id="keterangan" rows="2" placeholder="Catatan tambahan (opsional)"></textarea>
        </div>

        <button type="submit" id="btnSimpan">Simpan Transaksi</button>
        <div class="loading" id="loadingText">Sedang menyimpan data... Mohon tunggu.</div>
    </form>
</div>

<script>
    // ⚠️ Ganti URL DI BAWAH INI dengan URL Web App Google Apps Script Anda yang aktif!
    const WEB_APP_URL = "URL_WEB_APP_ANDA_DISINI";

    // 1. Ambil data dropdown saat halaman pertama kali dibuka
    window.onload = function() {
        // Set tanggal hari ini secara otomatis
        document.getElementById('tanggal').valueAsDate = new Date();

        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                // Isi dropdown Nama Warga
                let selectWarga = document.getElementById('namaWarga');
                selectWarga.innerHTML = '<option value="">-- Pilih Warga --</option>';
                data.warga.forEach(nama => {
                    let opt = document.createElement('option');
                    opt.value = nama;
                    opt.textContent = nama;
                    selectWarga.appendChild(opt);
                });

                // Isi dropdown Petugas
                let selectPetugas = document.getElementById('petugas');
                selectPetugas.innerHTML = '<option value="">-- Pilih Petugas --</option>';
                data.petugas.forEach(petugas => {
                    let opt = document.createElement('option');
                    opt.value = petugas;
                    opt.textContent = petugas;
                    selectPetugas.appendChild(opt);
                });
            })
            .catch(err => console.error("Gagal memuat data awal:", err));
    };

    // 2. Hitung jumlah bulan otomatis saat checkbox dicentang & hitung nominal seharusnya
    const checkboxes = document.querySelectorAll('input[name="bulan"]');
    checkboxes.forEach(cb => {
        cb.addEventListener('change', function() {
            let checkedCount = document.querySelectorAll('input[name="bulan"]:checked').length;
            document.getElementById('jumlahBulan').value = checkedCount;
            hitungTotal();
        });
    });

    function hitungTotal() {
        let jmlBulan = parseFloat(document.getElementById('jumlahBulan').value) || 0;
        let iuran = parseFloat(document.getElementById('iuranBulan').value) || 0;
        document.getElementById('nominalSeharusnya').value = jmlBulan * iuran;
    }

    // 3. Kirim data saat tombol submit ditekan
    document.getElementById('transaksiForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        document.getElementById('btnSimpan').style.display = 'none';
        document.getElementById('loadingText').style.display = 'block';

        // Kumpulkan bulan yang dicentang
        let bulanList = [];
        document.querySelectorAll('input[name="bulan"]:checked').forEach(cb => {
            bulanList.push(cb.value);
        });

        let formData = {
            tanggal: document.getElementById('tanggal').value,
            kodeRumah: document.getElementById('kodeRumah').value,
            nama: document.getElementById('namaWarga').value,
            belumBayar: document.getElementById('belumBayar').value,
            bulanList: bulanList,
            jumlahBulan: document.getElementById('jumlahBulan').value,
            iuranBulan: document.getElementById('iuranBulan').value,
            nominalSeharusnya: document.getElementById('nominalSeharusnya').value,
            nominalDiterima: document.getElementById('nominalDiterima').value,
            diterimaOleh: document.getElementById('petugas').value,
            keterangan: document.getElementById('keterangan').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(result => {
            alert('Sukses! ' + result.message);
            document.getElementById('transaksiForm').reset();
            document.getElementById('tanggal').valueAsDate = new Date(); // Reset tanggal ke hari ini
            document.getElementById('btnSimpan').style.display = 'block';
            document.getElementById('loadingText').style.display = 'none';
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Terjadi kesalahan saat menyimpan data.');
            document.getElementById('btnSimpan').style.display = 'block';
            document.getElementById('loadingText').style.display = 'none';
        });
    });
</script>

</body>
</html>
