<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kas & Iuran Warga</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2, h3 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="date"], input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .checkbox-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #fafafa; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .checkbox-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        button { background-color: #28a745; color: white; padding: 12px; border: none; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .btn-secondary { background-color: #6c757d; margin-top: 10px; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-danger { background-color: #dc3545; padding: 5px 10px; font-size: 12px; width: auto; }
        .btn-warning { background-color: #ffc107; color: black; padding: 5px 10px; font-size: 12px; width: auto; }
        .loading { text-align: center; color: #007bff; display: none; margin-top: 10px; }
        
        #appSection, #mainDashboard { display: none; }
        .card { background: #fff; border: 1px solid #ddd; padding: 20px; border-radius: 6px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <!-- SECTION 1: LOGIN / INPUT URL WEB APP -->
    <div id="loginSection" class="card">
        <h2>🔐 Verifikasi Pengurus</h2>
        <p style="text-align: center; color: #666;">Masukkan URL Web App Google Apps Script Anda untuk memulai.</p>
        <div class="form-group">
            <label for="inputUrl">URL Web App:</label>
            <input type="text" id="inputUrl" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <button onclick="hubungkanApp()">Masuk ke Sistem</button>
    </div>

    <!-- SECTION 2: DASHBOARD UTAMA (INPUT & TABEL RIWAYAT) -->
    <div id="mainDashboard">
        <h2>Sistem Pencatatan Iuran Warga</h2>
        <button class="btn-secondary" onclick="logoutApp()" style="margin-bottom: 20px;">Ganti / Keluar URL Web App</button>

        <!-- Form Input / Edit Transaksi -->
        <div class="card">
            <h3 id="formTitle">Tambah Transaksi Baru</h3>
            <form id="transaksiForm">
                <input type="hidden" id="rowId" value="">
                <input type="hidden" id="formAction" value="insert">

                <div class="form-group">
                    <label for="tanggal">Tanggal Transaksi:</label>
                    <input type="date" id="tanggal" required>
                </div>

                <div class="form-group">
                    <label for="kodeRumah">Kode Rumah:</label>
                    <input type="text" id="kodeRumah" placeholder="Contoh: A-12">
                </div>

                <div class="form-group">
                    <label for="namaWarga">No Rumah + Penghuni:</label>
                    <select id="namaWarga" required>
                        <option value="">-- Memuat Data Warga... --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="belumBayar">Belum Bayar (Bulan sebelumnya):</label>
                    <input type="text" id="belumBayar" placeholder="Contoh: Nov, Des">
                </div>

                <div class="form-group">
                    <label>Pilih Bulan yang Dibayar:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="bulan" value="Jan"> Jan</label>
                        <label><input type="checkbox" name="bulan" value="Feb"> Feb</label>
                        <label><input type="checkbox" name="bulan" value="Mar"> Mar</label>
                        <label><input type="checkbox" name="bulan" value="Apr"> Apr</label>
                        <label><input type="checkbox" name="bulan" value="Mei"> Mei</label>
                        <label><input type="checkbox" name="bulan" value="Jun"> Jun</label>
                        <label><input type="checkbox" name="bulan" value="Jul"> Jul</label>
                        <label><input type="checkbox" name="bulan" value="Agu"> Agu</label>
                        <label><input type="checkbox" name="bulan" value="Sep"> Sep</label>
                        <label><input type="checkbox" name="bulan" value="Okt"> Okt</label>
                        <label><input type="checkbox" name="bulan" value="Nov"> Nov</label>
                        <label><input type="checkbox" name="bulan" value="Des"> Des</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="jumlahBulan">Jumlah Bulan:</label>
                    <input type="number" id="jumlahBulan" readonly placeholder="Otomatis terhitung">
                </div>

                <div class="form-group">
                    <label for="iuranBulan">Iuran per Bulan (Rp):</label>
                    <input type="number" id="iuranBulan" placeholder="Contoh: 50000" oninput="hitungTotal()">
                </div>

                <div class="form-group">
                    <label for="nominalSeharusnya">Nominal Seharusnya (Rp):</label>
                    <input type="number" id="nominalSeharusnya" readonly placeholder="Otomatis terhitung">
                </div>

                <div class="form-group">
                    <label for="nominalDiterima">Nominal Diterima (Rp):</label>
                    <input type="number" id="nominalDiterima" required placeholder="Masukkan uang diterima">
                </div>

                <div class="form-group">
                    <label for="petugas">Diterima Oleh (Petugas):</label>
                    <select id="petugas" required>
                        <option value="">-- Memuat Data Petugas... --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="keterangan">Keterangan:</label>
                    <textarea id="keterangan" rows="2" placeholder="Catatan tambahan"></textarea>
                </div>

                <button type="submit" id="btnSimpan">Simpan Transaksi</button>
                <button type="button" id="btnBatalEdit" class="btn-secondary" style="display:none;" onclick="resetForm()">Batal Edit</button>
                <div class="loading" id="loadingText">Memproses data... Mohon tunggu.</div>
            </form>
        </div>

        <!-- Tabel Riwayat & Manajemen Data -->
        <div class="card">
            <h3>Riwayat Transaksi Masuk</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Tanggal</th>
                            <th>Warga</th>
                            <th>Jml Bln</th>
                            <th>Nominal</th>
                            <th>Petugas</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelTransaksiBody">
                        <tr><td colspan="7" style="text-align: center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let WEB_APP_URL = localStorage.getItem("saved_webapp_url") || "";

    window.onload = function() {
        if (WEB_APP_URL) {
            document.getElementById('inputUrl').value = WEB_APP_URL;
            hubungkanApp();
        }
    };

    function hubungkanApp() {
        let urlInput = document.getElementById('inputUrl').value.trim();
        if (!urlInput) {
            alert('Mohon masukkan URL Web App terlebih dahulu!');
            return;
        }
        WEB_APP_URL = urlInput;
        localStorage.setItem("saved_webapp_url", WEB_APP_URL);

        // Ambil data awal dari Apps Script
        fetchData();
    }

    function logoutApp() {
        localStorage.removeItem("saved_webapp_url");
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('mainDashboard').style.display = 'none';
    }

    let globalDataTransaksi = [];

    function fetchData() {
        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                // Tampilkan dashboard utama
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                document.getElementById('tanggal').valueAsDate = new Date();

                // Isi dropdown Warga
                let selectWarga = document.getElementById('namaWarga');
                selectWarga.innerHTML = '<option value="">-- Pilih Warga --</option>';
                data.warga.forEach(nama => {
                    let opt = document.createElement('option');
                    opt.value = nama; opt.textContent = nama;
                    selectWarga.appendChild(opt);
                });

                // Isi dropdown Petugas
                let selectPetugas = document.getElementById('petugas');
                selectPetugas.innerHTML = '<option value="">-- Pilih Petugas --</option>';
                data.petugas.forEach(petugas => {
                    let opt = document.createElement('option');
                    opt.value = petugas; opt.textContent = petugas;
                    selectPetugas.appendChild(opt);
                });

                // Simpan & Render Tabel Transaksi
                globalDataTransaksi = data.transaksi;
                renderTabel(globalDataTransaksi);
            })
            .catch(err => {
                console.error(err);
                alert('Gagal terhubung ke URL Web App. Periksa kembali URL Anda!');
            });
    }

    function renderTabel(list) {
        let tbody = document.getElementById('tabelTransaksiBody');
        tbody.innerHTML = '';
        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Belum ada data transaksi.</td></tr>';
            return;
        }

        list.forEach((item, index) => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.tanggal}</td>
                <td>${item.nama}</td>
                <td>${item.jumlahBulan}</td>
                <td>Rp ${Number(item.nominalDiterima).toLocaleString()}</td>
                <td>${item.diterimaOleh}</td>
                <td>
                    <button class="btn-warning" onclick="editData(${item.rowId})">Edit</button>
                    <button class="btn-danger" onclick="hapusData(${item.rowId})">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Hitung otomatis jumlah bulan & nominal
    const checkboxes = document.querySelectorAll('input[name="bulan"]');
    checkboxes.forEach(cb => {
        cb.addEventListener('change', function() {
            let checkedCount = document.querySelectorAll('input[name="bulan"]:checked').length;
            document.getElementById('jumlahBulan').value = checkedCount;
            hitungTotal();
        });
    });

    function hitungTotal() {
        let jmlBulan = parseFloat(document.getElementById('jumlahBulan').value) || 0;
        let iuran = parseFloat(document.getElementById('iuranBulan').value) || 0;
        document.getElementById('nominalSeharusnya').value = jmlBulan * iuran;
    }

    // Submit Form (Tambah / Update)
    document.getElementById('transaksiForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('btnSimpan').style.display = 'none';
        document.getElementById('loadingText').style.display = 'block';

        let bulanList = [];
        document.querySelectorAll('input[name="bulan"]:checked').forEach(cb => { bulanList.push(cb.value); });

        let formData = {
            action: document.getElementById('formAction').value,
            rowId: document.getElementById('rowId').value,
            tanggal: document.getElementById('tanggal').value,
            kodeRumah: document.getElementById('kodeRumah').value,
            nama: document.getElementById('namaWarga').value,
            belumBayar: document.getElementById('belumBayar').value,
            bulanList: bulanList,
            jumlahBulan: document.getElementById('jumlahBulan').value,
            iuranBulan: document.getElementById('iuranBulan').value,
            nominalSeharusnya: document.getElementById('nominalSeharusnya').value,
            nominalDiterima: document.getElementById('nominalDiterima').value,
            diterimaOleh: document.getElementById('petugas').value,
            keterangan: document.getElementById('keterangan').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(result => {
            alert(result.message);
            resetForm();
            fetchData(); // Refresh tabel dan data
        })
        .catch(err => {
            console.error(err);
            alert('Terjadi kesalahan.');
            document.getElementById('btnSimpan').style.display = 'block';
            document.getElementById('loadingText').style.display = 'none';
        });
    });

    // Fungsi Pilih Data untuk Diedit
    function editData(rowId) {
        let item = globalDataTransaksi.find(d => d.rowId === rowId);
        if (!item) return;

        document.getElementById('formAction').value = 'update';
        document.getElementById('rowId').value = item.rowId;
        document.getElementById('formTitle').textContent = 'Edit Data Transaksi (Baris ' + rowId + ')';
        document.getElementById('btnSimpan').textContent = 'Perbarui Transaksi';
        document.getElementById('btnBatalEdit').style.display = 'inline-block';

        document.getElementById('tanggal').value = item.tanggal;
        document.getElementById('kodeRumah').value = item.kodeRumah;
        document.getElementById('namaWarga').value = item.nama;
        document.getElementById('belumBayar').value = item.belumBayar;
        document.getElementById('jumlahBulan').value = item.jumlahBulan;
        document.getElementById('iuranBulan').value = item.iuranBulan;
        document.getElementById('nominalSeharusnya').value = item.nominalSeharusnya;
        document.getElementById('nominalDiterima').value = item.nominalDiterima;
        document.getElementById('petugas').value = item.diterimaOleh;
        document.getElementById('keterangan').value = item.keterangan;

        // Centang ulang bulan yang sesuai
        let daftarBulanCek = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
        checkboxes.forEach((cb, idx) => {
            cb.checked = (item.bulanArray[idx] === "Lunas");
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Fungsi Hapus Data
    function hapusData(rowId) {
        if (!confirm('Yakin ingin menghapus data transaksi ini dari spreadsheet?')) return;

        let formData = {
            action: 'delete',
            rowId: rowId
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(result => {
            alert(result.message);
            fetchData();
        })
        .catch(err => alert('Gagal menghapus data.'));
    }

    function resetForm() {
        document.getElementById('transaksiForm').reset();
        document.getElementById('formAction').value = 'insert';
        document.getElementById('rowId').value = '';
        document.getElementById('formTitle').textContent = 'Tambah Transaksi Baru';
        document.getElementById('btnSimpan').textContent = 'Simpan Transaksi';
        document.getElementById('btnSimpan').style.display = 'block';
        document.getElementById('btnBatalEdit').style.display = 'none';
        document.getElementById('loadingText').style.display = 'none';
        document.getElementById('tanggal').valueAsDate = new Date();
        checkboxes.forEach(cb => cb.checked = false);
    }
</script>

</body>
</html>
